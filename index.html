<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أجمل قلب ❤️</title>
    <!-- استيراد خطوط جوجل الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الصفحة الأساسية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a0a10 0%, #050505 100%);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #fff;
        }

        /* حاوية المحتوى بتصميم الزجاج الشفاف (Glassmorphism) */
        .glass-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 30px;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 10;
            margin: 40px 0;
            position: relative;
        }

        /* عنوان رومانسي متوهج */
        .romantic-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-style: italic;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #ff4d6d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(255, 77, 109, 0.4));
        }

        .sub-title {
            font-size: 1.2rem;
            color: #d1b3c4;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* حاوية الصورة مع تأثير الإطار المتوهج */
        .image-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
            border-radius: 20px;
            padding: 10px;
            background: linear-gradient(45deg, #ff4d6d, #ff758c, #ffb3c6);
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.5);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        .image-wrapper:hover {
            box-shadow: 0 0 60px rgba(255, 77, 109, 0.8);
        }

        .image-wrapper img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            display: block;
            transition: transform 0.3s ease;
        }

        /* الرسالة الرومانسية */
        .message-box {
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #f8e1e7;
            min-height: 80px;
            padding: 0 15px;
        }

        /* حاوية الفيديو الأنيقة */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 77, 109, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* القلوب المتوهجة في الخلفية */
        .glow-heart {
            position: absolute;
            bottom: -50px;
            width: 15px;
            height: 15px;
            background: #ff4d6d;
            transform: rotate(-45deg);
            animation: floatUp linear infinite;
            z-index: 1;
            filter: blur(1px);
            box-shadow: 0 0 15px #ff4d6d, 0 0 30px #ff4d6d;
        }

        .glow-heart::before, .glow-heart::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #ff4d6d;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff4d6d, 0 0 30px #ff4d6d;
        }

        .glow-heart::before { top: -8px; left: 0; }
        .glow-heart::after { top: 0; left: 8px; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(-45deg) scale(1.5); opacity: 0; }
        }

        /* أنيميشن ظهور العناصر */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.9s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- حاوية المحتوى الرئيسية -->
    <div class="glass-container">
        
        <!-- العنوان -->
        <h1 class="romantic-title fade-in-up">My Love</h1>
        <p class="sub-title fade-in-up delay-1">إلى أجمل حكاية في حياتي.. ❤️</p>
        
        <!-- الصورة مع التأثير ثلاثي الأبعاد -->
        <div class="image-wrapper fade-in-up delay-2" id="tiltImage">
            <img src="https://i.postimg.cc/gx43pL8B/IMG-20260909-234836-426.jpg" alt="لحظتنا الجميلة">
        </div>

        <!-- رسالة رومانسية بتتكتب لوحدها -->
        <div class="message-box fade-in-up delay-2">
            <p id="typing-text"></p>
        </div>

        <!-- الفيديو -->
        <div class="video-wrapper fade-in-up delay-3">
            <iframe src="https://www.youtube.com/embed/jacxQUFbZZ4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

    </div>

    <!-- سكريبتات الحركة -->
    <script>
        // 1. توليد القلوب المتوهجة في الخلفية
        function createGlowHeart() {
            const heart = document.createElement('div');
            heart.classList.add('glow-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 4 + 4 + 's'; // بين 4 و 8 ثواني
            heart.style.opacity = Math.random() * 0.6 + 0.2;
            
            const size = Math.random() * 15 + 8 + 'px';
            heart.style.width = size;
            heart.style.height = size;
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 8000);
        }
        setInterval(createGlowHeart, 400);

        // 2. تأثير الكتابة للرسالة الرومانسية
        const text = "كل لحظة معاك هي أجمل هدية من ربنا.. بحبك يا أجمل حاجة حصلتلي ❤️";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 100); // سرعة الكتابة
            }
        }
        // تأخير بدء الكتابة لحد ما الصفحة تظهر
        setTimeout(typeWriter, 1500);

        // 3. تأثير الإمالة ثلاثية الأبعاد (3D Tilt) للصورة
        const tiltImage = document.getElementById('tiltImage');
        
        tiltImage.addEventListener('mousemove', (e) => {
            const rect = tiltImage.getBoundingClientRect();
            const x = e.clientX - rect.left; // موضع الماوس بالنسبة للصورة
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -15; // أقصى زاوية 15 درجة
            const rotateY = ((x - centerX) / centerX) * 15;
            
            tiltImage.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        });

        tiltImage.addEventListener('mouseleave', () => {
            tiltImage.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            tiltImage.style.transition = 'transform 0.5s ease'; // إرجاع سلس
        });

        tiltImage.addEventListener('mouseenter', () => {
            tiltImage.style.transition = 'none'; // إلغاء الانتقال أثناء الحركة عشان ميبطأش
        });
    </script>

</body>
    </html>
