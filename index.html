<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أجمل قلب في الكون ❤️</title>
    <!-- استيراد خطوط جوجل الرومانسية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الصفحة الأساسية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* خلفية سينمائية فخمة */
            background: radial-gradient(circle at top left, #1a0b2e, #0d0514, #050208);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #fff;
            padding: 30px 0;
        }

        /* إضاءات نيون متحركة (Aurora Effect) */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            z-index: 0;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }
        .orb-1 { width: 350px; height: 350px; background: #ff4d6d; top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #7b2cbf; bottom: -100px; right: -100px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: #ff9a9e; top: 40%; left: 60%; animation-delay: -10s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 60px) scale(1.2); }
        }

        /* قلوب عائمة في الخلفية */
        .bg-heart {
            position: fixed;
            color: rgba(255, 77, 109, 0.1);
            font-size: 120px;
            z-index: 1;
            pointer-events: none;
            animation: floatBgHeart 18s infinite linear;
        }
        @keyframes floatBgHeart {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg) scale(1.5); opacity: 0; }
        }

        /* النجوم في الخلفية */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* حاوية المحتوى بتصميم الزجاج الشفاف الفخم */
        .glass-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 35px;
            padding: 45px 25px;
            width: 92%;
            max-width: 650px;
            /* إطار متوهج بألوان رومانسية */
            box-shadow: 0 0 50px rgba(255, 77, 109, 0.15), inset 0 0 30px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 10;
            position: relative;
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* عنوان رومانسي متوهج */
        .romantic-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #ff6a88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 25px rgba(255, 106, 136, 0.8));
            line-height: 1.1;
        }

            font-size: 1.1rem;
            color: #e0c3d2;
            margin-bottom: 35
