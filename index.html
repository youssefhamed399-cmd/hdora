<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لحظة رومانسية ❤️</title>
    <!-- خطوط جوجل الرومانسية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الخلفية والخطوط */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb3b3 100%);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* لمنع ظهور شريط التمرير بسبب القلوب */
            position: relative;
        }

        /* حاوية المحتوى الرئيسية */
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            text-align: center;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 1.5s ease-out;
        }

        /* عنوان رومانسي */
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #d6336c;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* إطار الصورة */
        .image-container {
            margin-bottom: 25px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            display: inline-block;
            border: 5px solid #fff;
        }

        .image-container:hover {
            transform: scale(1.03) rotate(1deg);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* إطار الفيديو */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* نسبة العرض إلى الارتفاع 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 3px solid #fff;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* تأثير ظهور المحتوى */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* القلوب المتحركة في الخلفية */
        .heart {
            position: absolute;
            bottom: -100px;
            background-color: #ff4d4d;
            width: 20px;
            height: 20px;
            transform: rotate(-45deg);
            animation: floatUp 5s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }

        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff4d4d;
            border-radius: 50%;
        }

        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; left: 10px; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(-45deg) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- عنوان رومانسي -->
    <div class="container">
        <h1>Love You ❤️</h1>
        
        <!-- الصورة (تم استخدام الرابط المباشر من postimg) -->
        <div class="image-container">
            <img src="https://i.postimg.cc/gx43pL8B/IMG-20260909-234836-426.jpg" alt="صورتنا الرومانسية">
        </div>

        <!-- الفيديو (تم تحويل الرابط لصيغة Embed) -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/jacxQUFbZZ4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- سكريبت لتوليد القلوب المتحركة -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // تحديد موقع عشوائي وعرض عشوائي للقلب
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; // بين 3 و 6 ثواني
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            
            // حجم عشوائي
            const size = Math.random() * 20 + 10 + 'px';
            heart.style.width = size;
            heart.style.height = size;
            
            // إضافة القلب للصفحة
            document.body.appendChild(heart);
            
            // حذف القلب بعد انتهاء الحركة لتخفيف الضغط على المتصفح
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // إنشاء قلب كل 300 مللي ثانية
        setInterval(createHeart, 300);
    </script>

</body>
</html>
